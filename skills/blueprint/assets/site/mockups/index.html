<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screens</title>
<link rel="icon" href="../kit/icon.svg">
<link rel="stylesheet" href="../kit/blueprint.css">
<script src="../kit/lucide.min.js"></script><script src="../kit/data.js"></script>
<script src="../kit/kit.js"></script><script src="screens.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; }
  .vw { display: grid; grid-template-columns: 264px 1fr; height: 100dvh; }
  .vw.notes-on { grid-template-columns: 264px 1fr 340px; }
  .vw-list { border-right: 1px solid var(--line); background: var(--sidebar); overflow-y: auto; padding: 14px 10px 24px; }
  .vw-brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px 14px; font-weight: 600; font-size: 14px; color: var(--fg); text-decoration: none; }
  .vw-brand span { color: var(--fg-3); font-weight: 400; }
  .vw-g { font: 500 12px var(--mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 8px 6px; }
  .vw-i { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; color: var(--fg-2); font-size: 13px; background: none; border: 0; cursor: pointer; }
  .vw-i:hover { background: var(--hover); color: var(--fg); }
  .vw-i[aria-current="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  .vw-i .n { font: 12px var(--mono); color: var(--fg-3); width: 18px; flex: none; }
  .vw-i .r { margin-left: auto; font: 12px var(--mono); color: var(--fg-3); }
  .vw-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .vw-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; flex-wrap: nowrap; }
  .vw-bar h1 { white-space: nowrap; font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .vw-bar .what { color: var(--fg-3); font-size: 13px; flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vw-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px; overflow: hidden; position: relative; }
  .vw-frame { position: relative; transform-origin: center center; border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px -24px rgba(0,0,0,.35); overflow: hidden; background: var(--bg); transition: opacity var(--dur-small) var(--ease); }
  .vw-frame.phone { border-radius: 38px; box-shadow: 0 0 0 1px var(--line), 0 0 0 10px var(--panel), 0 0 0 11px var(--line), 0 30px 70px -20px rgba(0,0,0,.4); }
  .vw-frame iframe { border: 0; display: block; width: 100%; height: 100%; background: var(--bg); }
  .vw-frame.loading { opacity: .4; }
  .vw-size { position: absolute; bottom: 10px; right: 16px; font: 12px var(--mono); color: var(--fg-3); }
  .vw-notes { border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 20px 40px; background: var(--sidebar); font-size: 14px; line-height: 1.55; color: var(--fg-2); }
  .vw-notes h2 { font-size: 14px; margin: 0 0 10px; color: var(--fg); }
  .vw-notes ol, .vw-notes ul { padding-left: 20px; } .vw-notes li { margin: 6px 0; }
  .vw-notes code { font: 12.5px var(--mono); background: var(--hover); padding: 1px 4px; border-radius: 4px; }
  .vw-notes b, .vw-notes strong { color: var(--fg); }
  .vw-pick, #thmBtn { display: none; }
  @media (max-width: 900px) {
    .vw, .vw.notes-on { grid-template-columns: 1fr; }
    .vw-list { display: none; }
    .vw-pick { display: inline-flex; }
    .vw-notes { position: fixed; inset: auto 0 0 0; max-height: 70dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; z-index: 30; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.3); animation: sheet-in var(--dur-sheet) var(--spring); }
    .vw-bar .what { display: none; }
    .vw-stage { padding: 12px; }
  }
  @media (max-width: 640px) {
    .vw-bar { gap: 6px; padding: 8px 10px; }
    .vw-bar h1 { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
    #prev, #next, #full, #thm { display: none; }
    #thmBtn { display: inline-grid; }
    .vw-bar .seg button { padding: 0 8px; }
  }
  /* On a phone, Phone mode shows the screen itself, full bleed. */
  .vw.native .vw-stage { padding: 0; }
  .vw.native .vw-frame, .vw.native .vw-frame.phone { border-radius: 0; box-shadow: none; transform: none !important; width: 100% !important; height: 100% !important; }
  .vw.native .vw-size { display: none; }
</style>
</head><body>
<div class="vw" id="vw">
  <nav class="vw-list" aria-label="Screens">
    <a class="vw-brand" href="../index.html">${K.logo(20)}</a>
    <div id="list"></div>
  </nav>
  <section class="vw-main">
    <div class="vw-bar">
      <button class="icon-btn vw-pick" id="pick" aria-label="All screens" data-tip="All screens">${K.icon('layout-list')}</button>
      <a class="icon-btn" href="../index.html" aria-label="Back to the plan" data-tip="Back to the plan"><i data-lucide="arrow-left"></i></a>
      <h1 id="title">Screen</h1><span class="what" id="what"></span>
      <div class="seg" id="dev" role="group" aria-label="Device"><button data-value="phone" aria-pressed="false">Phone</button><button data-value="desktop" aria-pressed="true">Desktop</button></div>
      <div class="seg" id="thm" role="group" aria-label="Theme"><button data-value="light" aria-pressed="true">Light</button><button data-value="dark" aria-pressed="false">Dark</button></div>
      <button class="icon-btn" id="thmBtn" aria-label="Switch theme" data-tip="Switch theme"><i data-lucide="sun-moon"></i></button>
      <button class="icon-btn" id="prev" aria-label="Previous screen" data-tip="Previous" data-keys="←"><i data-lucide="chevron-left"></i></button>
      <button class="icon-btn" id="next" aria-label="Next screen" data-tip="Next" data-keys="→"><i data-lucide="chevron-right"></i></button>
      <button class="icon-btn" id="notesBtn" aria-label="Design notes" data-tip="Design notes" data-keys="N" aria-pressed="false"><i data-lucide="notebook-text"></i></button>
      <a class="icon-btn" id="full" target="_blank" aria-label="Open on its own" data-tip="Open on its own"><i data-lucide="external-link"></i></a>
    </div>
    <div class="vw-stage" id="stage">
      <div class="vw-frame" id="frame"><iframe id="ifr" title="Screen"></iframe></div>
      <span class="vw-size" id="size"></span>
    </div>
  </section>
  <aside class="vw-notes" id="notes" hidden><h2>Design notes</h2><div id="notesBody"></div></aside>
</div>
<script>
(() => {
  const all = SCREENS.flatMap((g) => g.items.map((s) => ({ ...s, group: g.group })));
  const $ = K.$;
  const vw = $('#vw'), ifr = $('#ifr'), frame = $('#frame'), stage = $('#stage');
  const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
  const phoneViewer = () => innerWidth < 640;
  let theme = document.documentElement.dataset.theme || 'light';
  let device = store('ixv-device') || (phoneViewer() ? 'phone' : 'desktop');
  let cur = 0;

  $('.vw-brand').innerHTML = K.logo(20) + ' ' + K.esc(BRAND.name) + ' <span>screens</span>';
  $('#pick').innerHTML = K.icon('layout-list');
  let n = 0;
  $('#list').innerHTML = SCREENS.map((g) => `<div class="vw-g">${K.esc(g.group)}</div>` + g.items.map((s) => `<button class="vw-i" data-id="${s.id}"><span class="n">${String(++n).padStart(2, '0')}</span><span>${K.esc(s.title)}</span><span class="r">${s.release}</span></button>`).join('')).join('');
  $('#list').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) go(b.dataset.id); };

  function fit() {
    const native = phoneViewer() && device === 'phone';
    vw.classList.toggle('native', native);
    const [w, h] = device === 'phone' ? [390, 844] : [1440, 900];
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    frame.classList.toggle('phone', device === 'phone');
    if (native) return;
    const cs = getComputedStyle(stage), pad = (device === 'phone' ? 16 : 4) + parseFloat(cs.paddingLeft);
    const s = Math.min(1, (stage.clientWidth - pad * 2) / w, (stage.clientHeight - pad * 2) / h);
    frame.style.transform = `scale(${s})`;
    frame.style.margin = `${-(h * (1 - s)) / 2}px ${-(w * (1 - s)) / 2}px`;
    $('#size').textContent = `${w}×${h} · ${Math.round(s * 100)}%`;
  }
  function src(s) { return `screens/${s.id}.html?theme=${theme}`; }
  function go(id, push = true) {
    id = (id || '').split('?')[0]; const i = all.findIndex((s) => s.id === id); cur = i < 0 ? 0 : i;
    const s = all[cur];
    document.title = `${s.title} · ${BRAND.name} screens`;
    $('#title').textContent = s.title; $('#what').textContent = s.what;
    K.$$('.vw-i').forEach((b) => b.setAttribute('aria-current', b.dataset.id === s.id));
    frame.classList.add('loading');
    ifr.src = src(s); $('#full').href = src(s);
    if (push) history.replaceState(null, '', '#' + s.id);
    $('#notesBody').innerHTML = '<p>Loading…</p>';
  }
  ifr.addEventListener('load', () => {
    frame.classList.remove('loading');
    try { ifr.contentWindow.postMessage({ type: 'theme', value: theme }, '*'); ifr.contentWindow.postMessage({ type: 'notes?' }, '*'); } catch {}
  });
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'notes') $('#notesBody').innerHTML = e.data.html || '<p>No notes for this screen yet.</p>';
  });
  $('#dev').addEventListener('change', (e) => { device = e.detail; store('ixv-device', device); fit(); });
  $('#thm').addEventListener('change', (e) => { theme = e.detail; K.setTheme(theme); try { ifr.contentWindow.postMessage({ type: 'theme', value: theme }, '*'); } catch {} $('#full').href = src(all[cur]); });
  K.$$('#dev button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.value === device));
  K.$$('#thm button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.value === theme));
  $('#thmBtn').onclick = () => { const b = K.$(`#thm button[data-value="${theme === 'dark' ? 'light' : 'dark'}"]`); b.click(); };
  const step = (d) => go(all[(cur + d + all.length) % all.length].id);
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
  function toggleNotes(on) {
    on = on ?? $('#notes').hidden;
    $('#notes').hidden = !on; vw.classList.toggle('notes-on', on); $('#notesBtn').setAttribute('aria-pressed', on);
    store('ixv-notes', on ? '1' : '0'); requestAnimationFrame(fit);
  }
  $('#notesBtn').onclick = () => toggleNotes();
  $('#pick').onclick = (e) => K.menu.open(e.currentTarget, SCREENS.flatMap((g, gi) => [...(gi ? [{ sep: true }] : []), { header: g.group }, ...g.items.map((s) => ({ label: s.title, hint: s.release, checked: all[cur].id === s.id, onSelect: () => go(s.id) }))]));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea,[contenteditable]') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'n' || e.key === 'N') toggleNotes();
  });
  new ResizeObserver(fit).observe(stage);
  addEventListener('hashchange', () => go(location.hash.slice(1), false));
  K.enhance(document);
  if (store('ixv-notes') === '1' && !phoneViewer()) toggleNotes(true);
  go(location.hash.slice(1) || all[0].id, false);
  fit();
})();
</script>
</body></html>
