# Test vectors, not secrets: every key in these files comes from a fixed label ("machine seed",
# "phone seed") or from all-zero bytes, so the Rust and TypeScript links can be checked against
# each other. No real identity or password is in them.
version: 2
secret:
  ignored_paths:
    - fixtures/link/**
    - spikes/s4-wasm/src/identity.rs
    # Web Push: the tests use the keys published in RFC 8291 Appendix A, the standard's own
    # example, so the encryption can be checked byte for byte. Nothing private to anyone.
    - crates/inyon-engine/src/webpush.rs
    - crates/inyon-engine/src/push.rs
    # Pages tokens: minted from "fixture-session-secret: not a real one" so both hubs can be
    # checked against the same tokens. They open nothing on any real hub.
    - fixtures/pages/**
