# Spike S1: Dioxus 0.7 as Inyon's Android app. Its own workspace, so it stays out of the root one.
[workspace]

[package]
name = "inyon-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["launch", "lib", "mobile"] }

[target.'cfg(target_os = "android")'.dependencies]
# the same jni major version dioxus-desktop uses, so there is one copy
jni = "0.21"
ndk-context = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
