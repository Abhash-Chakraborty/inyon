# Spike S4: the phone's link (Noise IK + ed25519 identity) as wasm in a browser, talking to the
# TypeScript side in packages/link. Its own workspace, so it stays out of the root one.
[package]
name = "s4-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the same crates and features crates/inyon-link picks, so the sizes here are the real ones
curve25519-dalek = "4.1"
ed25519-dalek = "2.2"
getrandom = "0.3"
serde_json = "1.0"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "MessageEvent", "WebSocket"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
