[package]
name = "inyon-app"
version.workspace = true
description = "The Inyon app in Rust (Dioxus): the browser copy at /next, the Android app, then desktop"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["launch", "lib"] }
# the view model the React app keeps in apps/web/src/lib, shared by every screen
inyon-chat-core = { path = "../../crates/inyon-chat-core" }
inyon-protocol = { path = "../../crates/inyon-protocol", default-features = false }
# replies are Markdown; only the parser, the chat draws the tree itself
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# the terminal view's events, in order, from xterm.js and the hub
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# the phone pairing code on the Machines page, drawn as SVG
qrcode = { version = "0.14", default-features = false }
# links read as the browser reads them (the Preview tab's check against the app's own address)
url = "2.5"

# the phone core in the app itself (the `phone` feature): the Android build runs it natively
inyon-phone = { path = "../../crates/inyon-phone", features = ["native"], optional = true }
inyon-api = { path = "../../crates/inyon-api", optional = true }
inyon-core = { path = "../../crates/inyon-core", optional = true }
# the core's store on disk, which the upgrade from the Capacitor app fills before the core starts
inyon-backends = { path = "../../crates/inyon-backends", optional = true }
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros"], optional = true }

# the bridge to the Android side (the Kotlin services, notifications and SSH); the same major
# version dioxus-desktop uses, so there is one copy
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# the SHA-256 a chunked upload finishes with, worked out over the chunks as they go
sha2 = "0.10"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "BinaryType", "Blob", "BlobPropertyBag", "Clipboard", "ClipboardEvent", "CloseEvent", "console", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FilePropertyBag", "FormData", "Headers", "History", "HtmlDocument", "HtmlElement", "HtmlIFrameElement", "HtmlInputElement", "HtmlScriptElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MediaQueryList", "MessageEvent", "MouseEvent", "Navigator", "Node", "NodeList", "ReferrerPolicy", "Request", "RequestCredentials", "RequestInit", "Response", "Selection", "Storage", "Url", "VisibilityState", "WebSocket", "WheelEvent", "Window", "AddEventListenerOptions"] }

[dev-dependencies]
# compressed /ws2 frames in the tests, as the hub sends them
miniz_oxide = "0.9"

[features]
default = []
# dx turns on the one its --platform names
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
# Android: the app in a WebView, with the phone core in the same process (android/build.sh)
mobile = ["dioxus/mobile", "phone"]
# the phone core (crates/inyon-phone) in-process instead of a hub over the network
phone = ["dep:inyon-phone", "dep:inyon-api", "dep:inyon-core", "dep:inyon-backends", "dep:tokio"]
