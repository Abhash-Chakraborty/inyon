[package]
name = "inyon-cli"
version.workspace = true
edition.workspace = true
description = "The inyon command: setup, status and services for the Inyon phone app"
license.workspace = true
publish.workspace = true

[[bin]]
name = "inyon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1.1"
inyon-engine = { path = "../../crates/inyon-engine" }
minisign-verify = "0.3"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# the certificate setup makes for a hub on the LAN: ring, as rustls uses, and no OpenSSL
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# local time for the dashboard (already built for crossterm)
libc = "0.2"
# the hub in Rust (INYON_HUB_IMPL=rust); the hub runs on Linux and macOS only
inyon-hub = { path = "../../crates/inyon-hub" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
minisign = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
