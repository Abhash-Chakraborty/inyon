[package]
name = "inyon-cli"
version = "0.16.1"
edition = "2021"
description = "The inyon command: setup, status and services for the Inyon phone app"
license = "MIT"
publish = false

[[bin]]
name = "inyon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1.1"
minisign-verify = "0.3"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[dev-dependencies]
minisign = "0.10"
