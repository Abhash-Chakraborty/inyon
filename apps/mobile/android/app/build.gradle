apply plugin: 'com.android.application'

// push is only built in when CI provides a Firebase app (see .github/workflows/android.yml)
def envString = { String name -> '"' + (System.getenv(name) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace = "dev.tether.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.tether.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("TETHER_VERSION_CODE") ?: "1")
        versionName System.getenv("TETHER_VERSION") ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "FCM_APP_ID", envString("TETHER_FCM_APP_ID")
        buildConfigField "String", "FCM_API_KEY", envString("TETHER_FCM_API_KEY")
        buildConfigField "String", "FCM_PROJECT_ID", envString("TETHER_FCM_PROJECT_ID")
        buildConfigField "String", "FCM_SENDER_ID", envString("TETHER_FCM_SENDER_ID")
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // release builds are signed when CI provides a keystore (see .github/workflows/mobile.yml)
    signingConfigs {
        release {
            if (System.getenv("TETHER_KEYSTORE")) {
                storeFile file(System.getenv("TETHER_KEYSTORE"))
                storePassword System.getenv("TETHER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TETHER_KEY_ALIAS")
                keyPassword System.getenv("TETHER_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("TETHER_KEYSTORE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            // gson, error_prone_annotations and jspecify (pulled in by the SSH and secrets libraries) all ship one
            excludes += ['META-INF/versions/9/module-info.class']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // sshlib's plain `tink` jar holds the same classes as security-crypto's `tink-android`, so only
    // tink-android stays, pinned to the version sshlib is built against
    implementation("org.connectbot:sshlib:$sshlibVersion") {
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }
    implementation "com.google.crypto.tink:tink-android:$tinkVersion"
    implementation "androidx.security:security-crypto:$securityCryptoVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    // no google-services plugin: Firebase is initialised from BuildConfig (see device/Push.java)
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "com.google.android.gms:play-services-base:$playServicesBaseVersion"
    implementation "com.google.android.gms:play-services-tasks:$playServicesTasksVersion"
    implementation "com.google.android.gms:play-services-code-scanner:$codeScannerVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
