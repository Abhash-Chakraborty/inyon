<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Scripts only from the app itself, images only from the app (agent output must not make the
      browser fetch outside URLs). Connections stay open on purpose: the phone app reaches laptops
      through Cloudflare tunnels (wss://), LAN addresses (ws://, which is also why the Android
      app allows mixed content) and pkarr relays (https://). The hub's own header adds
      frame-ancestors, which a meta tag can't set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'none'; base-uri 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' * ws: wss: http: https: data: blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Inyon</title>
    <meta name="description" content="Your coding agents and tmux sessions, on every device." />
    <meta name="theme-color" content="#e9e8e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inyon" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
