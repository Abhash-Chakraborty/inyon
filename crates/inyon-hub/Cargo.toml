[package]
name = "inyon-hub"
version.workspace = true
description = "The hub: Inyon's API, live updates and web app over HTTP and WebSockets, on the hub core (port of apps/hub/src/index.ts and its routes)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }
getrandom = "0.3"
hmac = "0.13"
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
indexmap = "2.10"
inyon-backends = { path = "../inyon-backends" }
inyon-core = { path = "../inyon-core" }
inyon-engine = { path = "../inyon-engine" }
inyon-link = { path = "../inyon-link" }
inyon-protocol = { path = "../inyon-protocol" }
# the release's SHA256SUMS.minisig, checked before any file it lists is handed to a machine
minisign-verify = "0.3"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rust-embed = { version = "8.7", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# the password hash: Node's crypto.scrypt with its defaults (N 16384, r 8, p 1), as the Bun hub wrote it
scrypt = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.47", features = ["rt", "net", "time", "process", "io-util", "sync", "macros", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# commands run by tests never reach the user's tmux
inyon-backends = { path = "../inyon-backends", features = ["testing"] }
# registry hooks for tests that put a machine in by hand
inyon-core = { path = "../inyon-core", features = ["testing"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
