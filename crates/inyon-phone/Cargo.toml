[package]
name = "inyon-phone"
version.workspace = true
description = "Inyon's core in the phone app and the browser copy: inyon-api's routes and sockets on the browser's event loop, storage and fetch"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# the wasm module the web app loads, and a plain library for the native tests
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1.5"
inyon-api = { path = "../inyon-api" }
inyon-core = { path = "../inyon-core" }
inyon-link = { path = "../inyon-link" }
inyon-protocol = { path = "../inyon-protocol" }
js-sys = "0.3"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2.5"
# pinned exactly: the wasm-bindgen program that writes the JavaScript side (CI and
# apps/web/scripts/phone-core.ts) has to be this same version
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
inyon-core = { path = "../inyon-core", features = ["testing"] }
tokio = { version = "1.47", features = ["rt", "time", "macros", "test-util"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
