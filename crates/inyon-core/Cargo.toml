[package]
name = "inyon-core"
version.workspace = true
description = "The hub's agent readers: screens, transcripts and tmux output read into Inyon's wire types (port of apps/hub/src)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2.10", features = ["serde"] }
inyon-protocol = { path = "../inyon-protocol" }
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-script"] }
serde = { version = "1.0", features = ["derive"] }
# objects keep the order their keys came in, as JavaScript's do (tool inputs, hashed records)
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
