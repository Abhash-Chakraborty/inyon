[package]
name = "inyon-engine"
version.workspace = true
description = "The machine side of Inyon: the phone link, the connection to a hub, the commands both run, and notifications (port of apps/node)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hkdf = "0.13"
if-addrs = "0.15"
inyon-link = { path = "../inyon-link" }
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl"] }
# ring is the only crypto backend: no OpenSSL, and nothing that needs cmake to cross-build
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
# keys keep the order they were written in, so files under ~/.inyon stay as the Bun engine wrote them
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "process", "io-util", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2.5"
webpki-roots = "1.0"
# Mozilla's roots as whole certificates, which ureq needs when NODE_EXTRA_CA_CERTS adds to them
webpki-root-certs = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
