[package]
name = "inyon-protocol"
version.workspace = true
description = "Inyon's wire types: the JSON the hub, the engine and the app exchange"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2.10", features = ["serde"] }
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = ["macros"] }
ts-rs = { version = "12.0", features = ["indexmap-impl", "no-serde-warnings"] }
