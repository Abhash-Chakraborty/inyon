[package]
name = "inyon-mux"
version.workspace = true
description = "Inyon's own session keeper: holds terminals the way a tmux server does and answers the tmux commands the hub sends, for a machine without tmux"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
portable-pty = "0.9"
# the screen each pane keeps: what the terminal shows now, its scrollback and its title
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
# setsid, so the keeper outlives the terminal or shell that started it
libc = "0.2"
