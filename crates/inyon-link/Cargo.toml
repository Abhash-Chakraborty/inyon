[package]
name = "inyon-link"
version.workspace = true
description = "The phone link: identities, the Noise channel, pairing codes and pkarr records (port of packages/link)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ed25519-dalek 2 and scrypt 0.11 share curve25519-dalek 4 and sha2 0.10 with snow, so the phone's
# wasm carries one copy of each
curve25519-dalek = "4.1"
ed25519-dalek = "2.2"
getrandom = "0.3"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# only what Noise_IK_25519_ChaChaPoly_SHA256 needs (the default features pull in ring and AES-GCM)
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
url = "2.5"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# randomness from the browser's crypto.getRandomValues; also needs the cfg in .cargo/config.toml
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# a message 1 built by hand, with keys snow would never make (tests/low_order.rs)
chacha20poly1305 = "0.10"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
