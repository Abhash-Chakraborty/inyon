name: Android

# Builds the signed Android APK.
#   push to main  -> refreshes the "android-latest" pre-release, so the newest build is one tap away
#   tag v1.2.3    -> a release named after the tag, with the APK attached
#   run by hand   -> the APK as a workflow artifact
# Every run also starts the APK on an emulator (the smoke job) to catch crashes and R8 mistakes.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun node_modules/@capacitor/cli/bin/capacitor sync android
        working-directory: apps/mobile

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(jq -r .version package.json)-build.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      # JVM unit tests; the ones that need an sshd skip here and run in the ssh-plugin job
      - name: Unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :app:testReleaseUnitTest

      - name: Build
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          TETHER_VERSION: ${{ steps.version.outputs.name }}
          TETHER_VERSION_CODE: ${{ github.run_number }}
          # Firebase app for push; when unset the APK builds without push
          TETHER_FCM_APP_ID: ${{ secrets.TETHER_FCM_APP_ID }}
          TETHER_FCM_API_KEY: ${{ secrets.TETHER_FCM_API_KEY }}
          TETHER_FCM_PROJECT_ID: ${{ secrets.TETHER_FCM_PROJECT_ID }}
          TETHER_FCM_SENDER_ID: ${{ secrets.TETHER_FCM_SENDER_ID }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # forks and first runs: a debug build still installs, but can't update a signed one
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/tether.apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export TETHER_KEYSTORE="$RUNNER_TEMP/release.p12"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tether.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/tether.apk" | grep -iE "verified|signer|certificate" | grep -viE "warning"

      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/tether.apk

      # turns R8's renamed stack traces back into readable ones (retrace)
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: apps/mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="$RUNNER_TEMP/tether-$VERSION.apk"
          cp "$RUNNER_TEMP/tether.apk" "$apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Tether $VERSION" --generate-notes
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create android-latest "$apk" --prerelease --target "$GITHUB_SHA" \
              --title "Latest Android build ($VERSION)" \
              --notes "Built from $GITHUB_SHA on main. Install over the previous build; tagged releases are the stable ones."
          fi

  # Installs the APK on an emulator, starts it and checks logcat. Publishing happens in the apk job,
  # so a flaky emulator never holds back a release; an emulator that never boots is a warning, a
  # crash is a failure.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: ${{ github.workspace }}/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tether-${{ needs.apk.outputs.version }}
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        id: first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: .github/scripts/android-smoke.sh "${{ runner.temp }}/apk/tether.apk"

      - name: Did the first try reach a verdict
        id: tried
        run: echo "verdict=$([ -f "$OUT/verdict" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Start the app on a fresh emulator (the first one failed to come up)
        if: steps.tried.outputs.verdict == 'no'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: .github/scripts/android-smoke.sh "${{ runner.temp }}/apk/tether.apk"

      - name: Verdict
        run: |
          v=$(cat "$OUT/verdict" 2>/dev/null || echo none)
          case "$v" in
            pass) echo "The APK started cleanly: no crash, plugins loaded, web app loaded." ;;
            none) echo "::warning::The emulator never came up, so the APK was not smoke tested." ;;
            *) echo "::error::$v"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ needs.apk.outputs.version }}
          path: smoke/
          if-no-files-found: ignore

  # JVM tests for the native SSH plugin (SshCore) against a throwaway sshd on the runner
  ssh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # settings.gradle pulls the Capacitor modules from node_modules and the files `cap sync` writes
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun node_modules/@capacitor/cli/bin/capacitor sync android
        working-directory: apps/mobile

      - name: Start sshd
        run: |
          d="$RUNNER_TEMP/sshd"
          mkdir -p "$d"
          chmod 700 "$d"
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q openssh-server
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$d/host_ed25519"
          ssh-keygen -q -t ed25519 -N '' -C tether-test -f "$d/client_ed25519"
          cp "$d/client_ed25519.pub" "$d/authorized_keys"
          chmod 600 "$d/authorized_keys"
          # runs as the runner user, which can only log in as itself; MaxSessions 10 is the
          # OpenSSH default, spelled out because the tests rely on it to exercise the pool
          cat > "$d/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $d/host_ed25519
          PidFile $d/sshd.pid
          AuthorizedKeysFile $d/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          MaxSessions 10
          EOF
          # OpenSSH 9.8+ throttles sources that connect without logging in, as the probe test does
          if /usr/sbin/sshd -t -f "$d/sshd_config" -o PerSourcePenalties=no 2>/dev/null; then
            echo "PerSourcePenalties no" >> "$d/sshd_config"
          fi
          /usr/sbin/sshd -f "$d/sshd_config" -E "$d/sshd.log"
          for i in $(seq 1 20); do
            ssh -F /dev/null -i "$d/client_ed25519" -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null "$(id -un)@127.0.0.1" true 2>/dev/null && break
            sleep 0.5
          done
          ssh -F /dev/null -i "$d/client_ed25519" -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null "$(id -un)@127.0.0.1" 'echo sshd is up'
          {
            echo "TETHER_SSH_TEST_HOST=127.0.0.1"
            echo "TETHER_SSH_TEST_PORT=2222"
            echo "TETHER_SSH_TEST_USER=$(id -un)"
            echo "TETHER_SSH_TEST_KEY=$d/client_ed25519"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: sshd log
        if: failure()
        run: cat "$RUNNER_TEMP/sshd/sshd.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ssh-plugin-test-report
          path: apps/mobile/android/app/build/reports/tests/
