name: inyon

# Builds the inyon program as single binaries (Bun, the hub and the web app inside), so a machine
# needs nothing else installed. Each is also published as tether-node-<system>, the name the
# updater from before the rename to Inyon asks for. inyon-web.tar.gz is the web app built for
# GitHub Pages, which pages.yml publishes from each release.
#   push to main  -> refreshes the "node-latest" pre-release
#   tag v1.2.3    -> attached to that release, which the one-line installers fetch from, and the
#                    web app published from it
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/node/**', 'apps/hub/**', 'apps/web/**', 'packages/**', '.github/workflows/node.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: apps/node

      - run: bun run build

      - name: Build
        run: |
          out="$RUNNER_TEMP/dist"
          bun apps/node/build.ts "$out"
          "$out/inyon-linux-x64" --version
          # the one-line installers: curl …/get.sh | sh, or irm …/get.ps1 | iex
          cp apps/node/get.sh apps/node/get.ps1 "$out/"
          # the web app for GitHub Pages, listed in SHA256SUMS like the rest
          bun run --filter @inyon/web build:hosted
          tar -czf "$out/inyon-web.tar.gz" -C apps/web/dist-hosted .
          (cd "$out" && sha256sum inyon-web.tar.gz >> SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: inyon
          path: ${{ runner.temp }}/dist

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/dist/*)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Inyon ${GITHUB_REF_NAME#v}" --generate-notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release delete node-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create node-latest "${files[@]}" --prerelease --target "$GITHUB_SHA" \
              --title "Latest inyon build" \
              --notes "Built from $GITHUB_SHA on main. Run \`inyon pair\` on a laptop and scan the code with the Inyon app."
          fi

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
