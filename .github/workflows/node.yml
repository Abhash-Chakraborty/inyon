name: inyon

# Builds the inyon program as single binaries (Bun, the hub and the web app inside), so a machine
# needs nothing else installed. Each is also published as tether-node-<system>, the name the
# updater from before the rename to Inyon asks for.
#   push to main  -> refreshes the "node-latest" pre-release
#   tag v1.2.3    -> attached to that release, and copied to the public downloads repo
#                    (Abhash-Chakraborty/inyon-releases) that the one-line installers fetch from
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/node/**', 'apps/hub/**', 'apps/web/**', 'packages/**', '.github/workflows/node.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: apps/node

      - run: bun run build

      - name: Build
        run: |
          out="$RUNNER_TEMP/dist"
          bun apps/node/build.ts "$out"
          "$out/inyon-linux-x64" --version
          # the one-line installers: curl …/get.sh | sh, or irm …/get.ps1 | iex
          cp apps/node/get.sh apps/node/get.ps1 "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: inyon
          path: ${{ runner.temp }}/dist

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/dist/*)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Inyon ${GITHUB_REF_NAME#v}" --generate-notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release delete node-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create node-latest "${files[@]}" --prerelease --target "$GITHUB_SHA" \
              --title "Latest inyon build" \
              --notes "Built from $GITHUB_SHA on main. Run \`inyon pair\` on a laptop and scan the code with the Inyon app."
          fi

      # this repo is private, so the installers download from a public one; needs a fine-grained
      # token with contents: write on inyon-releases, saved as the RELEASES_TOKEN secret
      - name: Publish downloads
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASES_TOKEN secret: skipping the public downloads"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* -R Abhash-Chakraborty/inyon-releases \
            --title "Inyon ${GITHUB_REF_NAME#v}" --notes "Inyon ${GITHUB_REF_NAME#v}. See the README for the one-line setup." --latest
