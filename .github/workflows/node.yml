name: inyon

# Builds everything a release attaches: the inyon command (apps/cli, through cli.yml, one file per
# system, about 2 MB) as inyon-<system>, and the engine behind it (Bun, the hub and the web app
# inside, so a machine needs nothing else) as inyon-engine-<system>, on Linux both against glibc
# and against musl for Alpine. inyon-web.tar.gz is the web app as static files, for anyone who
# wants to serve it themselves. One SHA256SUMS lists them all, signed with minisign as
# SHA256SUMS.minisig, which the installers and `inyon update` check before trusting the list.
#   push to main  -> refreshes the "node-latest" pre-release
#   tag v1.2.3    -> attached to that release, which the one-line installers fetch from
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/cli/**', 'apps/node/**', 'apps/hub/**', 'apps/web/**', 'packages/**', 'scripts/**', '.github/workflows/node.yml', '.github/workflows/cli.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the inyon command for each system, as artifacts named like the release files
  cli:
    uses: ./.github/workflows/cli.yml

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # get.sh's tests check a signed mock release when minisign is on the machine
      - run: sudo apt-get update -q > /dev/null && sudo apt-get install -y -q minisign > /dev/null
      - run: bun test
        working-directory: apps/node

      - run: bun run build

      - name: Build
        run: |
          out="$RUNNER_TEMP/dist"
          bun apps/node/build.ts "$out"
          "$out/inyon-engine-linux-x64" --version
          # each inyon-engine-* file gzipped too, under half the size, which the installers and
          # the updater take first
          for f in "$out"/inyon-engine-*; do gzip -9 -k "$f"; done
          # the web app for GitHub Pages
          bun run --filter @inyon/web build:hosted
          tar -czf "$out/inyon-web.tar.gz" -C apps/web/dist-hosted .
          rm -f "$out/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine
          path: ${{ runner.temp }}/dist

  publish:
    needs: [cli, engine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: inyon-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Checksums and installers
        env:
          # a password-less minisign secret key; forks and runs without it get an unsigned list
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cd "$RUNNER_TEMP/dist"
          # the one-line installers: curl …/get.sh | sh, or irm …/get.ps1 | iex
          cp "$GITHUB_WORKSPACE/apps/node/get.sh" "$GITHUB_WORKSPACE/apps/node/get.ps1" .
          # one list for every file, the installers and the list's own signature left out of it
          ls | grep -v -e '^get\.' -e '^SHA256SUMS' | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          # the layout the installers and updaters count on
          want="inyon-linux-x64 inyon-linux-x64.gz inyon-engine-linux-x64 inyon-engine-linux-x64.gz inyon-engine-linux-x64-musl inyon-engine-linux-x64-musl.gz inyon-windows-arm64.exe inyon-web.tar.gz"
          for f in $want; do
            grep -q " $f\$" SHA256SUMS || { echo "::error::$f is missing from the release"; exit 1; }
          done
          # the signature get.sh and `inyon update` check the list against (the key file lives
          # outside the upload and is gone again before the step ends)
          if [ -n "$KEY" ]; then
            sudo apt-get update -q > /dev/null && sudo apt-get install -y -q minisign > /dev/null
            keyfile="$RUNNER_TEMP/minisign.key"
            # minisign wants the key file whole, a comment line above the key
            (umask 077 && { case "$KEY" in "untrusted comment:"*) ;; *) echo "untrusted comment: minisign secret key" ;; esac; printf '%s\n' "$KEY"; } > "$keyfile")
            minisign -S -s "$keyfile" -m SHA256SUMS -x SHA256SUMS.minisig < /dev/null
            rm -f "$keyfile"
            minisign -V -m SHA256SUMS -x SHA256SUMS.minisig -P RWRTvQv/ifQnD3jarY1oarS0AKdhogH+mdgn/o0NzT/Ro8L43nFqqfp6
          else
            echo "::notice::MINISIGN_SECRET_KEY isn't set, so SHA256SUMS is not signed"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inyon
          path: ${{ runner.temp }}/dist

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/dist/*)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Inyon ${GITHUB_REF_NAME#v}" --generate-notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release delete node-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create node-latest "${files[@]}" --prerelease --target "$GITHUB_SHA" \
              --title "Latest inyon build" \
              --notes "Built from $GITHUB_SHA on main. Run \`inyon pair\` on a laptop and scan the code with the Inyon app."
          fi

  # a fresh install in four Linux containers from a mock of this release, and an upgrade from a
  # real 0.12.0 install (see scripts/container-tests.sh)
  containers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cli, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inyon-linux-x64
          path: ${{ runner.temp }}/dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/inyon-tests
          key: inyon-0.12.0-linux-x64
      # the mock release signs its checksums with the test key, as a real one is signed
      - run: sudo apt-get update -q > /dev/null && sudo apt-get install -y -q minisign > /dev/null
      - run: scripts/container-tests.sh
        env:
          INYON_DIST: ${{ runner.temp }}/dist
