name: Phone apps

# Builds the Android APK and an unsigned iOS IPA. Runs by hand, and on version tags, where the
# files are attached to the GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun node_modules/@capacitor/cli/bin/capacitor sync android
        working-directory: apps/mobile
      - name: Build
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TETHER_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export TETHER_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export TETHER_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tether.apk"
          else
            # without a keystore, a debug build still installs fine for trying it out
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/tether.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tether-android
          path: ${{ runner.temp }}/tether.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun node_modules/@capacitor/cli/bin/capacitor sync ios
        working-directory: apps/mobile
      - name: Build (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$RUNNER_TEMP/tether-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tether-ios-unsigned
          path: ${{ runner.temp }}/tether-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" tether.apk tether-unsigned.ipa -R "$GITHUB_REPOSITORY" --clobber
