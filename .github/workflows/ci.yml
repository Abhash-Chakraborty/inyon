name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # a test that hangs fails here instead of holding a runner until it's shut down
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        working-directory: apps/hub
      - run: bun test
        working-directory: apps/web
      - run: bun test
        working-directory: packages/link
      - run: bun test
        working-directory: apps/node
      - run: bun run build
