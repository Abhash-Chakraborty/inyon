name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # a test that hangs fails here instead of holding a runner until it's shut down
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        working-directory: apps/hub
      - run: bun test
        working-directory: apps/web
      - run: bun test
        working-directory: packages/link
      - run: bun test
        working-directory: apps/node
      - run: bun run build

  # the built app in Chromium at phone widths: text stays inside the composer and chat bubbles
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - run: bun run e2e
        working-directory: apps/web
      # how fast the built app opens and how smooth it stays under updates, in the job summary. A
      # shared runner's numbers wobble, so this reports and never fails the build
      - name: Speed report
        continue-on-error: true
        working-directory: apps/web
        run: |
          {
            echo '### Speed (phone profile, 10 Mbit, this runner)'
            echo '```'
            bun scripts/perf/cold.ts | grep -v fetched
            bun scripts/perf/updates.ts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
