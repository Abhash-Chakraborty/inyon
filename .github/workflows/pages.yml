name: Site

# Publishes inyon.abhashchakraborty.tech: the home page, the docs (site/docs), the changelog and the
# latest release's files under /download (each checked against its SHA256SUMS), plus get.sh and
# get.ps1 at the root so the one-line installers can be typed short. site/build.ts does all of it.
# The app itself is never hosted here; it runs on your own computers, phone and hub.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/*.webp', 'apps/web/public/icon.svg', '.github/workflows/pages.yml']
  # after a release is built, so the short installer URLs serve that release's scripts, and again
  # after the Android job adds the APK and signs the checksum list anew
  workflow_run:
    workflows: [inyon, Android]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # the newest release's files, so the short installer URLs and /download always match the
        # binaries the installers fetch
        run: bun site/build.ts --mirror --out out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
