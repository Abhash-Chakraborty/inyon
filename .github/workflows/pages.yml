name: Site

# Publishes inyon.abhashchakraborty.tech: the download and docs page in site/, static files only.
# The app itself is never hosted here; it runs on your own computers, phone and hub.
on:
  push:
    branches: [main]
    paths: ['site/**', 'apps/web/public/icon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir out
          cp -r site/. out/
          cp apps/web/public/icon.svg out/icon.svg
          touch out/.nojekyll
          # the site's own domain
          echo inyon.abhashchakraborty.tech > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
