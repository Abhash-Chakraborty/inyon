name: Site

# Publishes inyon.abhashchakraborty.tech: the home page, the docs (site/docs), the changelog and
# get.sh and get.ps1 at the root so the one-line installers can be typed short. The latest
# release's files (each checked against its signed SHA256SUMS) go to dl.abhashchakraborty.tech,
# and the ones versions before 0.17.1 read stay under the site's /download. site/build.ts builds
# it all and site/publish-downloads.ts uploads the files.
# The app itself is never hosted here; it runs on your own computers, phone and hub.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/*.webp', 'apps/web/public/icon.svg', '.github/workflows/pages.yml']
  # after a release is built, so the short installer URLs serve that release's scripts, and again
  # after the Android job adds the APK and signs the checksum list anew (build.ts serves a release
  # only once its list names the APK, and keeps the one before until then)
  workflow_run:
    workflows: [inyon, Android]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, so each page's last-changed date (sitemap, article:modified_time) is real
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # the newest release's files, so the short installer URLs and the downloads always match
        # the binaries the installers fetch
        run: bun site/build.ts --mirror --out out --dl dl
      # the same checked files to dl.abhashchakraborty.tech (an R2 bucket), where installs and
      # updates download from since 0.17.1. Before the site deploys, so its download links never
      # name a file that isn't there. The keys can only write that bucket
      - name: Publish the downloads
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun site/publish-downloads.ts dl
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # GitHub keeps its own copy of each README image for a while: clear it, so the release badge
      # (badge/release-*.svg from this build) shows the new version straight away
      - name: Refresh the README's images on GitHub
        continue-on-error: true
        run: |
          sleep 30
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY" |
            grep -oE '(src|srcset)="https://camo\.githubusercontent\.com/[^"]+"' |
            sed -E 's/^(src|srcset)="//; s/"$//' | sort -u |
            while read -r url; do curl -fsS -X PURGE "$url" >/dev/null || echo "couldn't clear $url"; done
