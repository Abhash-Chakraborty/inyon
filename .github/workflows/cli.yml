name: inyon cli

# Builds and tests the inyon command (apps/cli, Rust) on each system it ships for, and keeps the
# binaries as artifacts named like the release files (inyon-<os>-<arch>, plus the gzipped copy).
# Only rustup and cargo as the runners ship them; the Linux builds are static (musl) so one file
# runs on glibc and Alpine alike, and Windows on ARM is cross-built on the x64 runner. node.yml
# calls this workflow, so a release tag builds the command and the engine in one run.
on:
  # a push to main runs this through node.yml, which publishes what it builds
  pull_request:
    # the protocol crate's tests also read packages/protocol and fixtures/
    paths: ['apps/cli/**', 'crates/**', 'packages/protocol/**', 'fixtures/**', '.cargo/**', 'Cargo.toml', 'Cargo.lock', 'rustfmt.toml', '.github/workflows/cli.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cli

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the wire types against the TypeScript ones, the protocol samples and the shared fixtures
      - run: cargo test -p inyon-protocol
      # the link against the TS link's bytes (fixtures/link); it also has to build as wasm, which
      # is how the phone core will run it
      - run: cargo test -p inyon-link
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown -p inyon-link

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: inyon-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: inyon-linux-arm64 }
          - { runner: macos-14, target: aarch64-apple-darwin, name: inyon-darwin-arm64 }
          # GitHub has no Intel Mac runners left in the queue; the Apple silicon one builds the
          # Intel file and runs its tests under Rosetta
          - { runner: macos-14, target: x86_64-apple-darwin, name: inyon-darwin-x64, rosetta: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, name: inyon-windows-x64.exe }
          # cross-built on the x64 runner; its tests can't run there
          - { runner: windows-latest, target: aarch64-pc-windows-msvc, name: inyon-windows-arm64.exe, cross: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - name: musl toolchain
        if: ${{ contains(matrix.target, 'musl') }}
        # the TLS library has C in it, which needs a compiler that targets musl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - name: Rosetta
        if: ${{ matrix.rosetta }}
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # the workspace keeps one target/ at the repository root
          src="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/inyon"
          [[ "${{ matrix.target }}" == *windows* ]] && src="$src.exe"
          cp "$src" "$RUNNER_TEMP/out/${{ matrix.name }}"
          ls -l "$RUNNER_TEMP/out"
      - name: Gzip it
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        run: gzip -9 -k "$RUNNER_TEMP/out/${{ matrix.name }}"
      - name: Gzip it (Windows)
        if: ${{ startsWith(matrix.runner, 'windows') }}
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP "out/${{ matrix.name }}"
          $src = [IO.File]::OpenRead($f)
          $dst = [IO.File]::Create("$f.gz")
          $gz = New-Object IO.Compression.GZipStream($dst, [IO.Compression.CompressionLevel]::Optimal)
          try { $src.CopyTo($gz) } finally { $gz.Dispose(); $dst.Dispose(); $src.Dispose() }
      - name: Version
        if: ${{ !matrix.cross }}
        shell: bash
        run: '"$RUNNER_TEMP/out/${{ matrix.name }}" version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/out/${{ matrix.name }}*
          if-no-files-found: error
